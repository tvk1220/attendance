<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teacher Registration</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
        }
    </style>
</head>

<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-lg p-8">

        <h1 class="text-2xl font-bold text-center text-green-700 mb-2">
            Teacher Registration
        </h1>

        <p class="text-center text-gray-500 text-sm mb-6">
            Create your teacher account
        </p>


        <!-- Department -->

        <label class="block text-sm font-semibold text-gray-700 mb-2">
            Department
        </label>

        <select
            id="teacherDepartment"
            class="w-full border border-gray-300 rounded-lg px-4 py-3 mb-4 focus:outline-none focus:ring-2 focus:ring-green-500"
        >

            <option value="">Select Department</option>
            <option value="MCA">MCA</option>
            <option value="MBA">MBA</option>
            <option value="MSC">M.Sc</option>

        </select>


        <!-- Teacher Name -->

        <label class="block text-sm font-semibold text-gray-700 mb-2">
            Enter Your Name
        </label>

        <input
            type="text"
            id="teacherName"
            placeholder="Enter your name"
            class="w-full border border-gray-300 rounded-lg px-4 py-3 mb-4 focus:outline-none focus:ring-2 focus:ring-green-500"
        >


        <!-- Password -->

        <label class="block text-sm font-semibold text-gray-700 mb-2">
            Set Your Password
        </label>

        <input
            type="password"
            id="teacherPassword"
            placeholder="Set your password"
            class="w-full border border-gray-300 rounded-lg px-4 py-3 mb-4 focus:outline-none focus:ring-2 focus:ring-green-500"
        >


        <!-- Re-enter Password -->

        <label class="block text-sm font-semibold text-gray-700 mb-2">
            Re-enter Your Password
        </label>

        <input
            type="password"
            id="confirmTeacherPassword"
            placeholder="Re-enter your password"
            class="w-full border border-gray-300 rounded-lg px-4 py-3 mb-3 focus:outline-none focus:ring-2 focus:ring-green-500"
        >


        <!-- Show Password -->

        <label class="flex items-center gap-2 text-sm text-gray-600 mb-6">

            <input
                type="checkbox"
                id="showTeacherPassword"
                class="w-4 h-4"
            >

            <span>Show Password</span>

        </label>


        <!-- Register Button -->

        <button
            type="button"
            id="teacherRegisterBtn"
            class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-lg transition"
        >
            Register
        </button>


        <p class="text-center text-xs text-gray-400 mt-5">
            Teacher Registration
        </p>

    </div>


        <script type="module" src="teacher-register-script.js"></script>
</body>
</html>
