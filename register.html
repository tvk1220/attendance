<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>College Registration</title>

    <!-- CSS -->
    <link rel="stylesheet" href="register-style.css">
</head>

<body>

    <div class="container">

        <h2>Register New College</h2>

        <!-- College Name -->
        <label for="collegeName">
            College Name
            <span style="color:red">*</span>
        </label>

        <input
            type="text"
            id="collegeName"
            placeholder="Enter College Name"
            pattern="[A-Za-z ]+"
            title="College name should contain letters and spaces only"
            required
        >


        <!-- College Code -->
        <label for="collegeCode">
            College Code
            <span style="color:red">*</span>
        </label>

        <input
            type="text"
            id="collegeCode"
            placeholder="Example: ABC123"
            pattern="[A-Za-z0-9]+"
            title="College code should contain letters and numbers only"
            required
        >


        <!-- Academic Year -->
        <label for="academicYear">
            Academic Year
            <span style="color:red">*</span>
        </label>

        <input
            type="text"
            id="academicYear"
            placeholder="Example: 2025-2026"
            pattern="[0-9]{4}-[0-9]{4}"
            title="Enter academic year like 2025-2026"
            required
        >


        <!-- College Address -->
        <label for="collegeAddress">
            College Address
            <span style="color:red">*</span>
        </label>

        <textarea
            id="collegeAddress"
            placeholder="Enter College Address"
            required
        ></textarea>


        <!-- College Logo -->
        <label for="collegeLogo">
            College Logo
            <span style="color:red">*</span>
        </label>

        <input
            type="file"
            id="collegeLogo"
            accept="image/png,image/jpeg,image/jpg"
            required
        >


        <!-- Register Button -->
        <button
            type="button"
            onclick="registerCollege()"
        >
            Register College
        </button>

    </div>


    <!-- JavaScript -->
    <script
        type="module"
        src="register-script.js">
    </script>

</body>

</html>
