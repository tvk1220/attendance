<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Attendance Management System</title>

    <link rel="stylesheet" href="welcome-style.css">
</head>

<body>

<div class="container">

    <div class="logo">
        <span>✓</span>
    </div>

    <h1>Smart Attendance</h1>
    <p class="subtitle">Management System</p>

    <div class="line"></div>

    <p class="instruction">
        Enter your college details to continue
    </p>

    <div class="form-group">
        <label>
            College Name <span>*</span>
        </label>

        <input
            type="text"
            id="collegeName"
            placeholder="Enter college name"
            required
        >
    </div>

    <div class="form-group">
        <label>
            College Code <span>*</span>
        </label>

        <input
            type="text"
            id="collegeCode"
            placeholder="Enter college code"
            required
        >
    </div>

    <div class="form-group">
        <label>
            Academic Year <span>*</span>
        </label>

        <input
            type="text"
            id="academicYear"
            placeholder="Example: 2026-2027"
            required
        >
    </div>

    <div class="buttons">

        <button type="button" id="loginBtn">
            Login
        </button>

        <button type="button" id="registerBtn">
            Register
        </button>

    </div>

    <p class="footer-text">
        Secure • Simple • Smart Attendance
    </p>

</div>

<script type="module" src="welcome-script.js"></script>

</body>
</html>
